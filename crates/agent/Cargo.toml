[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "Runs Jet's chat turns through Claude Code or Codex and keeps the thread, notes, and app connections"

# Stand-ins for the provider programs, built so the tests can run them. They are not product code.
[[bin]]
name = "fake-claude"
path = "tests/fakes/fake-claude.rs"
test = false

[[bin]]
name = "fake-codex"
path = "tests/fakes/fake-codex.rs"
test = false

[dependencies]
base64 = { workspace = true }
dotenvy = { workspace = true }
jsonschema = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }

[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "Runs Jet's chat turns through Claude Code, keeps the thread and notes, and keeps the workstation's polysim-bridge running"

[lib]
name = "agent"
path = "src/lib.rs"

# A stand-in for the Claude Code program: the contract tests spawn it instead of the real one.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

# A stand-in for a library's MCP server: the contract tests start it instead of quanty or polysim.
[[bin]]
name = "fake-mcp"
path = "src/bin/fake-mcp.rs"

# A stand-in for polysim-bridge: the workstation feed's contract tests spawn it instead of the real one.
[[bin]]
name = "fake-bridge"
path = "src/bin/fake-bridge.rs"

[dependencies]
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "Runs Jet's chat turns through Claude Code and keeps the thread, notes, and library connections"

[lib]
name = "agent"
path = "src/lib.rs"

# A stand-in for the Claude Code program: the contract tests spawn it instead of the real one.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

# A stand-in for a library's MCP server: the contract tests start it instead of quanty or polysim.
[[bin]]
name = "fake-mcp"
path = "src/bin/fake-mcp.rs"

[dependencies]
dotenvy = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

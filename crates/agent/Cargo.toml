[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "Runs Jet's chat turns through Claude Code and keeps the thread, notes, and library connections"

[lib]
name = "agent"
path = "src/lib.rs"

# A stand-in for the Claude Code program: the contract tests spawn it instead of the real one.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[dependencies]
dotenvy = { workspace = true }
jsonschema = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }

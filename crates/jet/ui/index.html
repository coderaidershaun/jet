<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./loading.css">
<link rel="stylesheet" href="./vendor/katex/katex.min.css">
<link rel="stylesheet" href="./chat.css">
<link rel="stylesheet" href="./chat/drawer/drawer.css">
<link rel="stylesheet" href="./chat/thread/thread.css">
<link rel="stylesheet" href="./chat/files.css">
<link rel="stylesheet" href="./chat/thread/cards/cards.css">
<link rel="stylesheet" href="./chat/stage/stage.css">
<link rel="stylesheet" href="./chat/composer/composer.css">
<link rel="stylesheet" href="./chat/settings/sheet.css">
<link rel="stylesheet" href="./workspace/workspace.css">
<script type="module" src="./chat/main.js"></script>
</head>
<body>
<div class="loading" id="loading" role="status">
  <p class="loading-text">Jet is loading…</p>
  <span class="loading-ring" aria-hidden="true"></span>
  <p class="loading-slow">Still loading. The server may be busy.</p>
  <noscript><p class="loading-text">Jet needs JavaScript.</p></noscript>
</div>
<div class="page" id="page" data-layout="centred">
  <aside class="drawer" id="drawer" aria-label="Jet and the agent stream">
    <div class="drawer-inner">
      <div class="drawer-id">
        <button id="jet-toggle" class="jet-toggle" type="button" aria-label="Collapse drawer" aria-controls="drawer" aria-expanded="true" title="Collapse drawer">
          <svg class="drawer-jet" id="drawer-jet" aria-hidden="true"></svg>
        </button>
        <div class="drawer-persona"><p class="drawer-name" id="drawer-name">Jet</p><p class="drawer-title" id="drawer-title">First-mate</p><p class="drawer-status" id="drawer-status" role="status"></p></div>
        <button id="context-toggle" class="context-toggle" type="button" aria-label="Context" title="Context" aria-expanded="false" aria-controls="context"></button>
      </div>
      <section class="context-capacity" id="context" aria-labelledby="context-title" hidden>
        <h2 id="context-title">Context</h2>
        <p id="context-model"></p>
        <p id="context-tokens"></p>
        <progress id="context-bar" max="100" hidden aria-label="Context capacity used"></progress>
        <p id="context-percent"></p>
        <p class="context-note" id="context-note"></p>
      </section>
      <nav class="app-list" aria-label="Registered apps"></nav>
      <div class="drawer-foot">
        <button class="gear" id="gear" type="button" aria-label="Settings" title="Settings"></button>
        <span class="settings-label">Settings</span>
      </div>
    </div>
  </aside>

  <div class="main">

    <div class="stage">
      <div class="thread" id="thread" role="log" aria-live="off" aria-label="Conversation" tabindex="0">
        <div class="column">
          <div id="banner"></div>
          <div id="rows"></div>
        </div>
      </div>
      <div class="empty" id="empty">
        <div class="hero" id="hero"></div>
        <h2 class="greeting" id="greeting"></h2>
        <p class="greeting-sub">Ask me anything. I'll remember what matters.</p>
      </div>
      <button class="jump" id="jump" type="button" hidden>Jump to latest</button>
    </div>

    <div class="composer" id="composer">
      <div class="held" id="held" hidden>
        <span class="held-label"><span id="held-text">Sends when Jet finishes</span><span class="held-files"></span></span>
        <button class="icon-button" id="held-cancel" type="button" aria-label="Cancel the held message"></button>
      </div>
      <div class="composer-row">
        <div class="field-box" id="field-box">
          <ul class="tray" id="tray" aria-label="Files to send" hidden></ul>
          <div class="field-line">
            <button class="attach" id="attach" type="button" aria-label="Attach files" title="Attach files"></button>
            <textarea id="field" rows="1" aria-label="Message" placeholder="Message Jet" enterkeyhint="send"></textarea>
            <div class="voice-pill" id="voice-pill" role="group" aria-label="Voice">
              <button class="voice" id="voice" type="button" aria-label="Speak replies" aria-pressed="false" title="Speak replies: off"></button>
              <button class="hear" id="hear" type="button" aria-label="Talk to Jet" aria-pressed="false" title="Talk to Jet: off"></button>
            </div>
          </div>
          <p class="drop-label" aria-hidden="true">Drop files to attach</p>
        </div>
        <button class="send" id="send" type="button" aria-label="Send" disabled></button>
      </div>
      <input type="file" id="attach-input" multiple hidden>
    </div>

  </div>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<div class="sr-only" id="announce" aria-live="polite"></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./vendor/katex/katex.min.css">
<link rel="stylesheet" href="./chat.css">
<link rel="stylesheet" href="./chat/drawer/drawer.css">
<link rel="stylesheet" href="./chat/thread/thread.css">
<link rel="stylesheet" href="./chat/thread/cards/cards.css">
<link rel="stylesheet" href="./chat/stage/stage.css">
<link rel="stylesheet" href="./chat/composer/composer.css">
<link rel="stylesheet" href="./chat/settings/sheet.css">
<script type="module" src="./chat/main.js"></script>
</head>
<body>
<div class="page" id="page" data-drawer="open" data-layout="centred">
  <aside class="drawer" id="drawer" aria-label="Jet and the Claude Code stream">
    <div class="drawer-inner">
      <div class="drawer-id">
        <svg class="drawer-jet" id="drawer-jet" aria-hidden="true"></svg>
        <p class="drawer-name" id="drawer-name">Jet</p>
        <p class="drawer-title" id="drawer-title">First-mate</p>
        <p class="cache-chip" id="cache-chip" data-warm="false" role="status">cold · nothing cached yet</p>
      </div>
      <section class="usage" id="usage" aria-labelledby="usage-title">
        <h2 class="section-title" id="usage-title">Usage</h2>
        <div class="usage-row usage-inline">
          <p class="usage-label">Session</p>
          <p class="usage-value" id="usage-session">—</p>
          <button class="text-button" id="usage-copy" type="button" disabled>Copy</button>
        </div>
        <div class="usage-row usage-inline">
          <p class="usage-label">Model · thinking</p>
          <p class="usage-value" id="usage-model">—</p>
        </div>
        <div class="usage-row">
          <div class="usage-head">
            <p class="usage-label">This reply</p>
            <p class="usage-status"><span class="usage-dot" id="usage-dot" data-status="idle"></span><span id="usage-status">idle</span></p>
          </div>
          <p class="usage-value" id="usage-tokens"></p>
          <p class="usage-value" id="usage-spend"></p>
          <p class="usage-value" id="usage-timing"></p>
        </div>
        <div class="usage-row">
          <p class="usage-label">Session totals</p>
          <p class="usage-value" id="usage-totals"></p>
        </div>
        <table class="usage-table" id="usage-table" hidden>
          <caption class="sr-only">Replies by model and thinking level</caption>
          <thead><tr><th scope="col">Model · thinking</th><th scope="col">Replies</th><th scope="col">Tokens</th><th scope="col">$</th></tr></thead>
          <tbody id="usage-table-body"></tbody>
        </table>
        <p class="usage-note" id="usage-note"></p>
      </section>
      <section class="log" data-open="false" aria-labelledby="log-title">
        <div class="log-head">
          <h2 class="section-title" id="log-title"><button class="log-toggle" id="log-toggle" type="button" aria-expanded="false" aria-controls="log-list">Raw stream (0)</button></h2>
          <button class="text-button" id="log-copy" type="button">Copy</button>
          <button class="text-button" id="log-clear" type="button">Clear</button>
        </div>
        <div class="log-list" id="log-list" role="list"></div>
      </section>
      <div class="drawer-foot">
        <button class="gear" id="gear" type="button" aria-label="Settings"></button>
        <span class="model-caption" id="model-caption">Sonnet · medium</span>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Show or hide the sidebar" aria-controls="drawer" aria-expanded="true"></button>
      <h1 class="title"><span id="header-name">Jet</span> <span class="header-status" id="header-status"></span></h1>
    </header>

    <div class="stage">
      <div class="thread" id="thread" role="log" aria-live="off" aria-label="Conversation" tabindex="0">
        <div class="column">
          <div id="banner"></div>
          <div id="rows"></div>
        </div>
      </div>
      <div class="empty" id="empty">
        <div class="hero" id="hero"></div>
        <h2 class="greeting" id="greeting"></h2>
        <p class="greeting-sub">Ask me anything. I'll remember what matters.</p>
      </div>
      <button class="jump" id="jump" type="button" hidden>Jump to latest</button>
    </div>

    <div class="composer" id="composer">
      <div class="held" id="held" hidden>
        <span id="held-text">Sends when Jet finishes</span>
        <button class="icon-button" id="held-cancel" type="button" aria-label="Cancel the held message"></button>
      </div>
      <div class="composer-row">
        <textarea id="field" rows="1" aria-label="Message" placeholder="Message Jet" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="button" aria-label="Send" disabled></button>
      </div>
    </div>
  </div>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<div class="sr-only" id="announce" aria-live="polite"></div>
</body>
</html>

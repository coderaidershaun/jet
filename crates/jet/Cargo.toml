[package]
name = "jet"
version.workspace = true
edition.workspace = true
description = "Jet, the first-mate character: desktop window, rig and settings"

[lib]
name = "jet"
path = "src/lib.rs"

[[bin]]
name = "jet"
path = "src/main.rs"

# The rig generator is an example, not a second binary, because Tauri treats a package
# with several binaries specially. `test = true` makes `cargo test` run its test.
[[example]]
name = "poses"
path = "rig/poses.rs"
test = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
agent = { path = "../agent" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }

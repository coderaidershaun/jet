[package]
name = "jet"
version.workspace = true
edition.workspace = true
description = "Jet browser home and agent server"

[features]
# Phonon-2, the local speech model, as a voice engine. It needs cmake to build.
# crispasr-sys is named only so that build.rs learns where its library was built.
phonon2 = ["agent/phonon2", "dep:crispasr-sys"]
# Phonon 31m, the local text-to-speech model, as a voice that speaks.
phonon-tts = ["agent/phonon-tts"]

[dependencies]
agent = { path = "../agent" }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
calamine = { workspace = true }
export = { path = "../export" }
getrandom = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
image = { workspace = true }
jiff = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
pdf-extract = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rlimit = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
crispasr-sys = { git = "https://github.com/CrispStrobe/CrispASR", tag = "v0.8.55", optional = true }

[dev-dependencies]
agent = { path = "../agent", features = ["test-server"] }
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "jet"
version.workspace = true
edition.workspace = true
description = "Jet, the first-mate character: desktop window, rig and settings"

[lib]
name = "jet"
path = "src/lib.rs"

[[bin]]
name = "jet"
path = "src/main.rs"

# The rig generator and the dev server are examples, not more binaries, because Tauri
# treats a package with several binaries specially. `test = true` makes `cargo test` run
# the generator's test.
[[example]]
name = "poses"
path = "rig/poses.rs"
test = true

[[example]]
name = "serve"
path = "dev/serve.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
agent = { path = "../agent" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }

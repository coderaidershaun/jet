[package]
name = "jet"
version.workspace = true
edition.workspace = true
description = "Jet, the first-mate character: desktop window, chat and settings"

[lib]
name = "jet"
path = "src/lib.rs"

[[bin]]
name = "jet"
path = "src/main.rs"

[[example]]
name = "serve"
path = "dev/serve.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
agent = { path = "../agent" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }

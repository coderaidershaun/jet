[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tauri = { version = "2.12.3", default-features = false, features = ["compression", "dynamic-acl", "wry"] }
tauri-build = { version = "2.7.2", default-features = false, features = ["config-json"] }
tauri-plugin-opener = { version = "2.7.1", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
ureq = { version = "3.4.2", default-features = false }

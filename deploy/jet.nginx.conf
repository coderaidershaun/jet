# Puts Jet behind nginx on https, with the page's content policy and app proofs kept out of the access log.

map $http_upgrade $jet_connection_upgrade {
    default upgrade;
    '' close;
}

# The page and its files get this policy. Pages the server writes itself get none from nginx: app pages and served
# files send their own, and a second policy header would be enforced as well and break them, and the MCP sign-in
# return page closes itself with an inline script. An empty value sends no header.
map $uri $jet_page_policy {
    ~^/(api|apps|mcp-signin)/ "";
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
}

# An app page's address holds a proof that lets anyone holding it use the app as the user, so it is never logged,
# and the page does not send it on as a referrer when the app links out.
map $uri $jet_logged {
    ~^/apps/ 0;
    default 1;
}
map $uri $jet_referrer_policy {
    ~^/apps/ no-referrer;
    default "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/xchainanalytics.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xchainanalytics.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name xchainanalytics.com;
    client_max_body_size 100m;
    access_log /var/log/nginx/access.log combined if=$jet_logged;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jet_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Content-Security-Policy $jet_page_policy always;
        add_header Referrer-Policy $jet_referrer_policy always;
    }

}

server {
    if ($host = xchainanalytics.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name xchainanalytics.com;
    return 301 https://$host$request_uri;


}
